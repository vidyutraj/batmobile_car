<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motor Control</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e2e0d9;
    --accent: #2f6fd6; --rec: #d23c3c; --ok: #2e8b57; --rev: #d9822b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614; --panel: #201f1d; --ink: #ecebe6; --muted: #9d9b94; --line: #34332f;
      --accent: #6c9cf0; --rec: #f06a6a; --ok: #5cc28d; --rev: #f0a45c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .status { font-size: 13px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.on { background: var(--ok); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 16px; }
  .readout { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .readout .val { font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .mode { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
          padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
  .mode.forward { color: var(--accent); border-color: var(--accent); }
  .mode.reverse { color: var(--rev); border-color: var(--rev); }
  .mode.brake { color: var(--rec); border-color: var(--rec); }
  .bar { position: relative; height: 10px; background: var(--line); border-radius: 5px; margin-top: 10px; overflow: hidden; }
  .bar div { position: absolute; top: 0; bottom: 0; left: 50%; width: 0; }
  .bar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row + .row { margin-top: 10px; }
  button { padding: 9px 14px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--bg); color: var(--ink); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.reverse { background: var(--rev); border-color: var(--rev); color: #fff; }
  button.stop { background: var(--rec); border-color: var(--rec); color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  input[type=range] { flex: 1; min-width: 200px; accent-color: var(--accent); }
  .sliderval { min-width: 90px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .seqs { display: grid; gap: 8px; }
  .seqs button { text-align: left; display: flex; justify-content: space-between; gap: 8px; }
  .seqs button small { color: var(--muted); }
  .seqs button.running { border-color: var(--accent); }
  .seqinfo { margin-top: 10px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.45em; }
  .seqinfo.live { color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  #log { margin: 0; height: 160px; overflow: auto; font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted);
         white-space: pre-wrap; }
  #log .out { color: var(--accent); }
  kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Motor Control</h1>
    <span class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></span>
  </header>

  <section class="panel">
    <div class="readout">
      <span class="val" id="speed">0</span>
      <span class="mode" id="mode">coast</span>
      <span class="status" id="pct"></span>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <div class="row" style="margin-top:14px">
      <button class="stop" id="stop">Stop (coast)</button>
      <button id="brake">Brake</button>
    </div>
    <div class="hint">Speeds are calibrated: 1–100% maps onto PWM duty 168–255 (66% is the lowest that starts the motor at 6&nbsp;V).<br><kbd>Space</kbd> stop · <kbd>B</kbd> brake · <kbd>↑</kbd>/<kbd>↓</kbd> forward/reverse at slider speed</div>
  </section>

  <section class="panel">
    <h2>Set speed</h2>
    <div class="row">
      <input type="range" id="slider" min="0" max="255" value="128">
      <span class="sliderval" id="sliderval"></span>
    </div>
    <div class="row">
      <button class="primary" id="fwd">Forward</button>
      <button class="reverse" id="rev">Reverse</button>
    </div>
    <h2 style="margin-top:16px">Presets</h2>
    <div class="presets" id="presets"></div>
  </section>

  <section class="panel">
    <h2>Sequences</h2>
    <div class="seqs" id="seqs"></div>
    <div class="seqinfo" id="seqinfo"></div>
  </section>

  <section class="panel">
    <h2>Serial log</h2>
    <pre id="log"></pre>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const PRESETS = [["Forward 25%", 64], ["Forward 50%", 128], ["Forward 100%", 255],
                 ["Reverse 25%", -64], ["Reverse 50%", -128], ["Reverse 100%", -255]];
let connected = false;

const get = path => fetch(path).then(r => r.json()).catch(() => null);
const setSpeed = v => get(`/speed?v=${v}`);
const pct = v => `${Math.round(Math.abs(v) / 2.55)}%`;

function showSlider() { $("sliderval").textContent = `${$("slider").value} (${pct($("slider").value)})`; }
$("slider").addEventListener("input", showSlider);
showSlider();

$("fwd").onclick = () => setSpeed(+$("slider").value);
$("rev").onclick = () => setSpeed(-$("slider").value);
$("stop").onclick = () => get("/stop");
$("brake").onclick = () => get("/brake");

for (const [label, v] of PRESETS) {
  const b = document.createElement("button");
  b.textContent = label;
  b.className = v > 0 ? "primary" : "reverse";
  b.onclick = () => setSpeed(v);
  $("presets").append(b);
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.key !== " ") return;
  if (e.key === " ") { e.preventDefault(); get("/stop"); }
  else if (e.key === "b" || e.key === "B") get("/brake");
  else if (e.key === "ArrowUp") { e.preventDefault(); setSpeed(+$("slider").value); }
  else if (e.key === "ArrowDown") { e.preventDefault(); setSpeed(-$("slider").value); }
});

function showState(s) {
  connected = s.connected;
  $("dot").classList.toggle("on", connected);
  $("status").textContent = connected ? "ESP32 connected" : "ESP32 disconnected — waiting for port…";
  document.querySelectorAll("button").forEach(b => b.disabled = !connected);
  $("speed").textContent = s.speed > 0 ? `+${s.speed}` : s.speed;
  $("mode").textContent = s.mode;
  $("mode").className = `mode ${s.mode}`;
  $("pct").textContent = s.duty ? `${pct(s.speed)} speed · PWM duty ${Math.abs(s.duty)} (${pct(s.duty)})` : "";
  const w = Math.abs(s.duty) / 255 * 50;
  const bar = $("bar");
  bar.style.width = `${w}%`;
  bar.style.left = s.duty < 0 ? `${50 - w}%` : "50%";
  bar.style.background = s.duty < 0 ? "var(--rev)" : "var(--accent)";
}

function showSeq(m) {
  document.querySelectorAll(".seqs button").forEach(b => b.classList.toggle("running", b.dataset.name === m.name));
  const info = $("seqinfo");
  info.classList.toggle("live", !!m.name);
  info.textContent = m.name ? `${m.title} — step ${m.step}/${m.steps}: ${m.label}`
                            : `Sequence ${m.ended}.`;
}

function log(m) {
  const el = $("log");
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 8;
  const line = document.createElement("div");
  line.className = m.dir;
  line.textContent = `${new Date().toLocaleTimeString()} ${m.dir === "out" ? "→" : "←"} ${m.text}`;
  el.append(line);
  while (el.childElementCount > 300) el.firstChild.remove();
  if (atBottom) el.scrollTop = el.scrollHeight;
}

get("/config").then(cfg => {
  if (!cfg) return;
  for (const [name, {title, steps}] of Object.entries(cfg.sequences)) {
    const b = document.createElement("button");
    b.dataset.name = name;
    b.innerHTML = `<span></span><small>${steps} steps</small>`;
    b.firstChild.textContent = title;
    b.disabled = !connected;
    b.onclick = () => get(`/run?seq=${name}`);
    $("seqs").append(b);
  }
  showState(cfg);
});

const es = new EventSource("/events");
es.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.type === "state") showState(m);
  else if (m.type === "seq") showSeq(m);
  else if (m.type === "log") log(m);
};
es.onerror = () => showState({connected: false, speed: 0, duty: 0, mode: "coast"});
</script>
</body>
</html>
